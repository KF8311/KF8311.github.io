name: Build Jekyll WITHOUT auto-enabling Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      # REMOVE THIS: It's enabling Pages automatically
      # - name: Setup Pages
      #   uses: actions/configure-pages@v5
      
      - name: Build with Jekyll
        # Use generic Jekyll action instead of Pages-specific one
        uses: jekyll/actions/jekyll-build@v2
        with:
          source: ./
          destination: ./_site
          
      # Optional: Upload artifact for manual use (won't deploy)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-site
          path: ./_site
